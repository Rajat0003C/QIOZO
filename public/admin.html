<!DOCTYPE html>

<style>
:root{--p:#0f8f7a;--p2:#3cc7b3;--bg:#eef8f6;--bd:#d6ece8;--soft:#e4f6f2;color-scheme:light}
*{box-sizing:border-box;margin:0}body{font-family:"Nunito","Segoe UI",system-ui,sans-serif;background:var(--bg);color:#1b2b2a;display:flex;min-height:100vh}

.btn{background:linear-gradient(135deg,var(--p2),var(--p));color:#fff;padding:9px 18px;border-radius:999px;font-weight:700;box-shadow:0 2px 6px #0f8f7a44}.btn:hover{transform:translateY(-1px)}.btn.l{background:var(--soft);color:var(--p);box-shadow:none}.btn.r{background:#fde8e8;color:#c0392b;box-shadow:none}
.tw{background:#fff;border-radius:18px;overflow:auto;box-shadow:0 2px 10px #0f8f7a14}table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:12px 14px;text-align:left;border-bottom:1px solid #edf5f3;vertical-align:middle}th{background:var(--soft);color:var(--p);font-size:12px;text-transform:uppercase;letter-spacing:.5px;position:sticky;top:0}tr:hover td{background:#f7fcfb}
a.btn{display:inline-block;text-decoration:none;padding:6px 12px;font-size:13px;margin-right:4px}.dl{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--bd);font-size:14px}.dl span{color:#7d8f8d}.dl b{text-align:right;word-break:break-word}

.sec{margin:24px 0 10px;font-size:17px}.pad{padding:16px}.note{color:#7d8f8d;display:block;margin-top:8px}.bars{display:flex;align-items:flex-end;gap:6px;height:130px}.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;font-size:10px}.bars i{display:block;width:100%;background:linear-gradient(var(--p2),var(--p));border-radius:6px 6px 0 0}
.bg{background:#f08a24;color:#fff;border-radius:10px;padding:0 7px;font-size:12px;margin-left:4px}.chip{background:var(--soft);color:var(--p);font-weight:700;font-size:13px;padding:4px 12px;border-radius:999px;margin:0 6px 6px 0;display:inline-block}
.fbar,.pbar,.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#fff;border-radius:16px;padding:10px 14px;margin-bottom:12px;box-shadow:0 2px 10px #0f8f7a14}.fbar label,.pbar label,.bar label{font-weight:700;font-size:13px;color:var(--p)}.fbar select,.pbar select,.bar select{width:auto;min-width:170px}

td img{width:48px;height:48px;object-fit:cover;border-radius:10px}td .btn{padding:6px 12px;font-size:13px;margin-right:4px}
.ov{position:fixed;inset:0;background:#0a2a2666;backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:9;padding:12px}.ov.on{display:flex}
.md{background:#fff;border-radius:22px;padding:24px;width:100%;max-width:500px;max-height:92vh;overflow:auto;animation:up .2s}@keyframes up{from{transform:translateY(14px);opacity:0}}.md label{display:block;font-weight:700;font-size:13px;margin:12px 0 5px}
#login{margin:auto;background:#fff;padding:32px;border-radius:22px;width:340px;box-shadow:0 8px 30px #0f8f7a33}

.xl{background:#fde0e0;color:#b33;padding:3px 9px;border-radius:8px;font-weight:700;white-space:nowrap}.xd{background:#8b1a1a;color:#fff;padding:3px 9px;border-radius:8px;font-weight:700;white-space:nowrap}
.stc{display:inline-block;padding:3px 10px;border-radius:8px;font-size:12px;font-weight:800;color:#fff;background:#7d8f8d}.s-Placed{background:#3b82f6}.s-Packed{background:#8b5cf6}.s-Waitingforpartner{background:#f59e0b}.s-Partnerassigned{background:#0ea5a4}.s-Outfordelivery{background:#f08a24}.s-Delivered{background:#16a34a}.s-Cancelled,.s-Rejected{background:#dc2626}.s-Requested{background:#3b82f6}.s-Approved,.s-Employee,.s-Refunded{background:#16a34a}.s-Underinquiry{background:#f59e0b}.s-Pickedup,.s-Receivedatoffice{background:#8b5cf6}
#login{padding:0;width:380px;overflow:hidden;border-radius:24px}.lhero{background:linear-gradient(135deg,#3cc7b3,#0f8f7a);color:#fff;padding:30px 28px}.lbrand{font-size:32px;font-weight:800;letter-spacing:6px}.lhero p{opacity:.9;margin-top:2px}.lbody{padding:26px 28px}
.pwf{position:relative}.pwf input{padding-right:64px}.eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;color:#0f8f7a;font-weight:700;font-size:12px}
.alr{position:fixed;inset:0;z-index:50;background:#000a;display:grid;place-items:center;padding:16px;animation:alf 1s infinite}@keyframes alf{50%{background:#7a0000cc}}.alb{background:#fff;border-radius:24px;padding:30px;max-width:560px;width:100%;box-shadow:0 10px 50px #000a;text-align:center;border:6px solid #dc2626}.alh{font-size:34px;font-weight:900;color:#dc2626;margin-bottom:10px}.alb p{font-size:18px;margin:10px 0}
.cw{height:44vh;overflow:auto;background:#f4fbfa;border-radius:12px;padding:8px;margin:8px 0}.cm{display:flex;flex-direction:column;max-width:80%;margin-bottom:8px}.cm span{padding:8px 12px;border-radius:14px;background:#fff;box-shadow:0 1px 3px #0001}.cm small{color:#7d8f8d;font-size:10px}.cm.agent{margin-left:auto;align-items:flex-end}.cm.agent span{background:#0f8f7a;color:#fff}
</style></head><body>
<div id="login"><div class="lhero"><div class="lbrand">QIOZO</div><p>Management</p></div><div class="lbody"><h2>Welcome back</h2><p style="color:#7d8f8d;margin:4px 0 14px">Sign in to manage products, orders and customers.</p><div class="pwf"><input id="pw" type="password" placeholder="Admin password" autocomplete="current-password"><button type="button" class="eye" onclick="const e=document.getElementById('pw');e.type=e.type=='password'?'text':'password'">Show</button></div><br><button class="btn" style="width:100%;padding:12px" onclick="doLogin()">Log in</button></div></div>
<div id="nb" class="nb" onclick="tab(this.dataset.t)" title="New orders, requests and questions"></div><aside id="side" style="display:none"></aside><main id="main" style="display:none"></main>
<div class="ov" id="ov"><div class="md" id="md"></div></div><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const toast=m=>{const t=$("#toast");t.textContent=m;t.style.display="block";setTimeout(()=>t.style.display="none",2500)};
// Field: [key,label,type,options]  types: text,num,date,area,sel,img

const EF=[["type","Job type","sel",JOBS],["name","Full name"],["phone","Phone"],["email","Email"],["aadhaar","Aadhaar number"],["address","Address","area"],["salary","Expected salary (₹/month)","num"],["status","Status","sel",["Requested","Approved","Employee","Rejected"]],["aadhaarVerified","Aadhaar verified after checking the photo?","sel",["No","Yes"]],["password","Delivery partner login password (set or change; leave blank to keep)"],["photo","Profile photo","img"]];
const SC={
 analysis:{t:"Dashboard"},
 products:{t:"Products",cols:["img","name","cat","cost","mrp","price","stock","expiry"],f:[["name","Name"],["unit","Pack size (e.g. 1 kg)"],["cat","Category","sel","cat"],["mrp","MRP (₹)","num"],["price","Selling price (₹)","num"],["cost","Purchase cost per unit (₹)","num"],["rating","Rating (0 to 5)","num"],["reviews","Number of ratings","num"],["stock","Stock","num"],["expiry","Expiry date","date"],["desc","Description","area"],["cod","Cash on delivery available?","sel",["yes","no"]],["variantsText","Pack sizes (optional). One per line: label|price|mrp|stock|cost   e.g.  500 g|25|30|40|18","area"],["img","Main photo (1:1)","img"],["images","More photos, in the order customers should see them","gallery"]]},
 categories:{t:"Categories",cols:["img","name"],f:[["name","Name"],["img","Photo","img"]]},
 banners:{t:"Banners",cols:["img","title","sub","link"],f:[["title","Title (e.g. Get 20% OFF)"],["sub","Headline"],["desc","Small text"],["btn","Button text"],["link","Opens this category or page when tapped","link"],["pos","Text position on the banner","sel",["left-top","left-middle","left-bottom","center-top","center-middle","center-bottom","right-top","right-middle","right-bottom"]],["mode","Banner style","sel",["Site design","Full banner (my own designed image)"]],["img","Banner photo (upload your own 1200 x 500 design, or a photo for the site design)","media"]]},
 coupons:{t:"Coupons",cols:["code","type","value","min","max","first"],f:[["code","Code"],["type","Type","sel",["pct","flat"]],["value","Value (% or ₹)","num"],["min","Minimum order (₹)","num"],["max","Max discount (₹, % type)","num"],["first","First order only","sel",["yes","no"]],["desc","Description shown to customers"]]},
 offers:{t:"Offers",cols:["type","title","desc"],f:[["type","Type","sel",["Bank","Payment","Category"]],["title","Title"],["desc","Details","area"],["code","Code (optional)"]]},
 orders:{t:"Orders",noadd:1,nodel:0,cols:["id","phone","items","total","tip","pay","status","agentName","scheduledFor","cancelReason","refundStatus","gift"],f:[["status","Status","sel",["Placed","Packed","Waiting for partner","Partner assigned","Out for delivery","Delivered","Cancelled"]],["agentName","Delivery partner name"],["agentPhone","Delivery partner phone"],["refundStatus","Refund status (customer gets an email when set to Refunded or Rejected)","sel",["","Pending","Refunded","Rejected"]],["unreachable","Customer did not answer the call? (then only the product price is refunded)","sel",["No","Yes"]],["etaMin","Set time left (minutes from now, optional)","num"]]},
 applications:{search:1,t:"Employment requests",noadd:1,act:1,filter:r=>r.status!="Employee",cols:["photo","name","type","phone","salary","status"],f:EF},
 employees:{search:1,t:"QIOZO employees",col:"applications",act:1,filter:r=>r.status=="Employee",cols:["photo","name","type","phone","email","salary","joined"],f:EF},
 expenses:{t:"Expenses",cols:["date","title","category","amount"],f:[["date","Date","date"],["title","What was it for"],["category","Category","sel",["Rent","Salaries","Electricity","Transport & fuel","Packaging","Marketing","Purchase of stock","Other"]],["amount","Amount (₹)","num"]]}, ads:{t:"Home ads",cols:["src","title","type","link"],f:[["title","Title (optional)"],["type","Type","sel",["image","video"]],["src","Photo or video","media"],["link","Opens this category or page when tapped","link"]]},
 startads:{t:"Starting ads",cols:["order","src","text","duration","skippable","skipAfter"],f:[["src","Photo or video (full screen)","media"],["type","Type","sel",["image","video"]],["text","Text on the ad (optional)"],["duration","Duration (seconds)","num"],["skippable","Skip option","sel",["no","yes"]],["skipAfter","Show Skip button after (seconds)","num"],["link","Opens this category or page when tapped","link"]]},
 posts:{t:"Community posts",noadd:1,act:1,cols:["src","name","phone","caption","ts"],f:[["caption","Caption","area"]]},
 blocked:{t:"Blocked accounts",noadd:1,cols:["phone","email","reason","ts"],f:[["reason","Reason"]]},
 partnerstats:{t:"Delivery stats"},
 badges:{t:"Footer images (website / Android)",cols:["img","label","link"],f:[["label","Label (e.g. Available on Android)"],["img","Image (3:1)","media"],["link","Link when tapped (optional)"]]},
 requests:{t:"Product requests",noadd:1,cols:["product","name","phone","note","status","ts"],f:[["status","Status","sel",["New","Considering","Added","Rejected"]]]},
 chats:{t:"Support chats & calls",noadd:1,act:1,cols:["name","phone","type","topic","status","updated"],f:[["status","Status","sel",["Open","Closed"]]]},
 returns:{t:"Returns & refunds",noadd:1,cols:["orderId","name","q","amount","reason","status","ts"],f:[["status","Status","sel",["Requested","Approved","Picked up","Received at office","Under inquiry","Refunded","Rejected"]]]},
 users:{act:1,t:"Users",noadd:1,cols:["photo","name","phone","email","gender","codBlocked"],f:[["name","Name"]]},
 notifications:{t:"Notifications",cols:["img","title","body","to"],f:[["title","Title"],["body","Message","area"],["img","Image (optional, 16:9)","media"],["target","When the customer taps it, open","target"],["to","Send to (all, or a mobile number)"]]},
 feedback:{t:"Reviews & Q&A",noadd:1,cols:["type","product","phone","rating","text","answer"],f:[["answer","Your answer / reply","area"]]},
 settings:{t:"Store settings"}};
const SF=[["storeName","Store name"],["lat","Store latitude","num"],["lng","Store longitude","num"],["baseFee","Delivery fee up to base distance (₹)","num"],["baseKm","Base distance (km)","num"],["stepM","Extra step (metres)","num"],["perStep","Fee per extra step (₹)","num"],["maxKm","Maximum delivery distance (km)","num"],["platformFee","Platform fee per order (₹)","num"],["packFee","Packaging charge per order (₹)","num"],["codFee","Handling fee for cash on delivery (₹)","num"],["gwPct","Payment gateway charge on online payments (%)","num"],["gstPct","GST on gateway charge (%)","num"],["openVeg","Vegetables open from (HH:MM, 24-hour)"],["openAll","All items open from (HH:MM)"],["closeAt","Shop closes at (HH:MM)"],["pickupMin","Minutes a delivery partner has to reach the store after accepting"],["addrChangeFee","Extra charge for changing the delivery address (₹)"],["giftWrapFee","Gift packaging charge (₹)"],["etaLow","Delivery time for the first distance: minimum minutes"],["etaHigh","Delivery time for the first distance: maximum minutes"],["etaStep","Extra minutes for every extra step of distance"],["vegCats","Categories open from the early time (comma separated)"],["lowStock","Low stock warning at (units)","num"],["helpPhone","Help phone"],["helpEmail","Help email"]];
const col=()=>SC[cur].col||cur;
let LOW=10;
let tok=sessionStorage.getItem("a"),cur="products",rows=[],cats=[];
const api=async(m,u,b)=>{const r=await fetch("/api/"+u,{method:m,headers:{"Content-Type":"application/json","x-admin":tok||""},body:b?JSON.stringify(b):undefined});if(r.status==401){out();throw 0}return r.json()};
async function doLogin(){const r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:$("#pw").value})});if(!r.ok)return toast("Wrong password");tok=$("#pw").value;sessionStorage.setItem("a",tok);start()}
function out(){tok=null;sessionStorage.removeItem("a");location.reload()}
const rs=(f,w,cb)=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,w/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*k;c.height=i.height*k;c.getContext("2d").drawImage(i,0,0,c.width,c.height);cb(c.toDataURL("image/jpeg",.8))};i.src=r.result};r.readAsDataURL(f)};
async function start(){$("#login").style.display="none";$("#side").style.display="";$("#main").style.display="";
 $("#side").innerHTML=`<h2>QIOZO<br><small>Management</small></h2>`+Object.keys(SC).map(k=>`<button id="t_${k}" onclick="tab('${k}')">${SC[k].t}</button>`).join("")+`<button onclick="location.href='/'">View store</button><button onclick="out()">Log out</button>`;
 cats=(await api("GET","categories")).map(c=>c.name);tab("analysis");setInterval(badges,30000);setInterval(watchCancel,12000);setInterval(watchChats,5000)}
async function tab(k,keep){cur=k;if(!keep)sqv="";lowBadge();badges();document.querySelectorAll("aside button").forEach(b=>b.classList.toggle("on",b.id=="t_"+k));const s=SC[k];if(k=="partnerstats")return pstats();if(k=="analysis")return analysis();
 if(k=="settings"){const st=(await (await fetch("/api/public")).json()).settings;
  $("#main").innerHTML=`<div class="top"><h2>${s.t}</h2></div><div class="tw" style="padding:16px;max-width:520px">${SF.map(([a,l,t])=>`<label style="font-weight:700;font-size:13px;display:block;margin:10px 0 4px">${l}</label><input id="s_${a}" ${t=="num"?'type="number" step="any"':""} value="${esc(st[a])}">`).join("")}${logoBlock(st)}<br><br><button class="btn" onclick="saveS()">Save settings</button></div>`;logoUI();return}
 {const all=await api("GET",s.col||k);rows=s.filter?all.filter(s.filter):all;if(k=="categories")ALLI=(await (await fetch("/api/public")).json()).settings.allImg||"";if(SKK[k])rows=[...rows].sort((x,y)=>(+(x[SKK[k]]||1e9))-(+(y[SKK[k]]||1e9)));if(k=="startads")SET=(await (await fetch("/api/public")).json()).settings;if(s.search&&sqv)rows=rows.filter(r=>((r.name||"")+" "+(r.phone||"")).toLowerCase().includes(sqv.toLowerCase()));if(k=="products"){if(pfc)rows=rows.filter(r=>r.cat==pfc);rows=[...rows].sort(SORTS[ps])}}
 $("#main").innerHTML=`<div class="top"><h2>${s.t} (${rows.length})</h2>${s.noadd?"":`<button class="btn" onclick="addNew()">+ Add new</button>`}</div>${k=="products"?prodBar():""}${s.search?sbar():""}${k=="categories"?allBar():""}${k=="startads"?adbar():""}<div class="tw"><table><tr>${SKK[k]?"<th>Seq</th>":""}${s.cols.map(c=>`<th>${c}</th>`).join("")}<th></th></tr>${rows.map((r,i)=>`<tr>${SKK[k]?`<td><input type="number" min="1" style="width:72px" value="${esc(r[SKK[k]]||"")}" onchange="setSeq('${r.id}',this.value)"></td>`:""}${s.cols.map(c=>`<td>${cell(r[c],c)}</td>`).join("")}<td style="white-space:nowrap"><button class="btn l" onclick="openForm(${i})">Edit</button><button class="btn r" onclick="del('${r.id}')">Delete</button>${s.act?actBtns(r):""}</td></tr>`).join("")||`<tr><td>Nothing here yet.</td></tr>`}</table></div>`}
function cell(v,c){if(c=="gift")return v?`<small><b>GIFT</b> ${esc(v.name)}, ${esc(v.address)}, ${esc(v.phone)}${v.wrap?" • gift wrap":""}</small>`:"";if(c=="photo"&&v)return `<img src="${esc(v)}" alt="" style="cursor:zoom-in" onclick="zoomImg(this.src)">`;if(c=="updated"&&v>1e12)return new Date(v).toLocaleString("en-IN");if(c=="expiry"&&v){const dd=Math.ceil((new Date(v)-Date.now())/864e5);return dd<=0?`<span class="xd">${esc(v)} (expired)</span>`:dd<=7?`<span class="xl">${esc(v)} (${dd} days left)</span>`:esc(v)}if(c=="status"&&v)return stcA(v);if(c=="codBlocked")return v?`<span class="xd">COD off</span>`:"";if(c=="scheduledFor")return v?new Date(v).toLocaleString("en-IN"):"";if(c=="ts"&&v>1e12)return new Date(v).toLocaleString("en-IN");if(c=="src")return v?(/\.(mp4|webm)$/i.test(v)?"Video":`<img src="${esc(v)}" alt="">`):"Text";if(c=="img"||c=="photo")return v?`<img src="${esc(v)}" alt="">`:"";if(Array.isArray(v))return esc(v.map(i=>i.name+" x"+i.q).join(", "));if(["total","mrp","price","cost","amount","tip"].includes(c))return "₹"+esc(v);if(c=="stock")return +v<=LOW?`<b style="color:#c0392b">${esc(v)} (low)</b>`:esc(v);if(c=="ts")return new Date(v).toLocaleDateString("en-IN");return esc(v)}
function inp(k,t,o,v){if(t=="img")return imgInp(k,v);if(t=="gallery")return galInp(k,v);const id="f_"+k;
 if(t=="num")return `<input id="${id}" type="number" step="any" value="${esc(v)}">`;if(t=="date")return `<input id="${id}" type="date" value="${esc(v)}">`;
 if(t=="area")return `<textarea id="${id}" rows="3">${esc(v)}</textarea>`;
 if(t=="target")return `<select id="${id}">${inpT(v)}</select>`;

const SZ={products_img:[1,1,800],products_images:[1,1,800],categories_img:[1,1,400],banners_img:[5,2,1250],ads_src:[2,1,1200],startads_src:[9,16,720],notifications_img:[16,9,800],all:[1,1,400]};
let CP=null,GL=[],ALLI="";
function cropPick(file,key,cb){const z=SZ[key]||[1,1,800];if(!file.type.startsWith("image/"))return cb(null);const r=new FileReader();r.onload=()=>{const im=new Image();im.onerror=()=>cb(null);im.onload=()=>{CP={im,z,cb,zoom:1,x:50,y:50};cropUI()};im.src=r.result};r.readAsDataURL(file)}
function cropDraw(c,w){const{im,z,zoom,x,y}=CP,h=Math.round(w*z[1]/z[0]);c.width=w;c.height=h;const sc=Math.max(w/im.width,h/im.height)*zoom,vw=w/sc,vh=h/sc;c.getContext("2d").drawImage(im,(im.width-vw)*x/100,(im.height-vh)*y/100,vw,vh,0,0,w,h)}
function cropUI(){let o=$("#ov2");if(!o){o=document.createElement("div");o.id="ov2";o.className="ov on";o.style.zIndex=12;o.innerHTML='<div class="md" id="md2"></div>';document.body.appendChild(o)}o.classList.add("on");const z=CP.z;
 $("#md2").innerHTML=`<h3>Crop image (${z[0]}:${z[1]} frame)</h3><p style="color:#7d8f8d;font-size:13px">Only the part inside this frame is shown to customers. Choose the position.</p><canvas id="cpv" style="width:100%;border-radius:12px;border:2px dashed #0f8f7a;background:#eee"></canvas><label>Zoom</label><input type="range" min="1" max="3" step="0.05" value="1" oninput="CP.zoom=+this.value;cropRef()"><label>Move left / right</label><input type="range" min="0" max="100" value="50" oninput="CP.x=+this.value;cropRef()"><label>Move up / down</label><input type="range" min="0" max="100" value="50" oninput="CP.y=+this.value;cropRef()"><br><div style="display:flex;gap:8px"><button class="btn" onclick="cropOk()">Use this crop</button><button class="btn l" onclick="cropNo()">Cancel</button></div>`;cropRef()}
const cropRef=()=>cropDraw($("#cpv"),Math.min(CP.z[2],600)),cropClose=()=>{const o=$("#ov2");if(o)o.classList.remove("on")};
function cropOk(){const c=document.createElement("canvas");cropDraw(c,CP.z[2]);const d=c.toDataURL("image/jpeg",.88),cb=CP.cb;cropClose();cb(d)}
function cropNo(){const cb=CP.cb;cropClose();cb(null)}
const upData=async d=>{const x=await api("POST","upload",{data:d});return x.url||""};
function upMedia(el){const f=el.files[0],k=el.dataset.k||"src";if(!f)return;
 const fin=async d=>{if(!d)return;$("#upst").textContent="Uploading…";const u=await upData(d);if(u){$("#f_"+k).value=u;const t=$("#f_type");if(t)t.value=d.startsWith("data:video")?"video":"image";$("#upst").textContent="Uploaded";const p=$("#pv_"+k);if(p){p.src=u;p.style.display=""}}else $("#upst").textContent="Upload failed"};
 if(f.type.startsWith("image/"))return cropPick(f,cur+"_"+k,fin);if(f.size>25*1048576)return toast("File is larger than 25 MB");const r=new FileReader();r.onload=()=>fin(r.result);r.readAsDataURL(f)}
const imgInp=(k,v)=>`<input id="f_${k}" value="${esc(v)}" placeholder="Image URL, or upload below"><input type="file" accept="image/*" style="margin-top:6px" onchange="imgPick(this,'${k}')"><small id="ust_${k}"></small><br><img id="pv_${k}" src="${esc(v)}" style="width:90px;height:90px;object-fit:cover;border-radius:10px;margin-top:6px" onerror="this.style.display='none'" onload="this.style.display=''">`;
function imgPick(el,k){const f=el.files[0];if(!f)return;cropPick(f,cur+"_"+k,async d=>{if(!d)return;$("#ust_"+k).textContent="Uploading…";const u=await upData(d);if(u){$("#f_"+k).value=u;$("#pv_"+k).src=u;$("#ust_"+k).textContent="Uploaded"}else $("#ust_"+k).textContent="Upload failed"})}
function galInp(k,v){try{GL=Array.isArray(v)?v:JSON.parse(v||"[]")}catch(e){GL=[]}setTimeout(galR,0);return `<input type="hidden" id="f_${k}" value="${esc(JSON.stringify(GL))}"><input type="file" accept="image/*" multiple onchange="galAdd(this.files)"><small id="gst" style="color:#7d8f8d"> Pick several photos. They are cropped one by one and shown to customers in this order.</small><div id="gl" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"></div>`}
function galR(){const h=$("#f_images"),g=$("#gl");if(!h||!g)return;h.value=JSON.stringify(GL);g.innerHTML=GL.map((u,i)=>`<div style="text-align:center"><img src="${esc(u)}" style="width:70px;height:70px;object-fit:cover;border-radius:10px;display:block"><small>${i+1}</small><br><button class="btn l" style="padding:2px 8px" onclick="galMv(${i},-1)">&larr;</button><button class="btn l" style="padding:2px 8px" onclick="galMv(${i},1)">&rarr;</button><button class="btn r" style="padding:2px 8px" onclick="galDel(${i})">x</button></div>`).join("")}
async function galAdd(files){for(const f of files){const d=await new Promise(r=>cropPick(f,"products_images",r));if(!d)continue;$("#gst").textContent=" Uploading…";const u=await upData(d);if(u){GL.push(u);galR()}}$("#gst").textContent=" Pick several photos. They are cropped one by one and shown to customers in this order."}
const galMv=(i,d)=>{const j=i+d;if(j<0||j>=GL.length)return;[GL[i],GL[j]]=[GL[j],GL[i]];galR()},galDel=i=>{GL.splice(i,1);galR()};
const parseVar=t=>String(t||"").split("\n").map(l=>l.split("|").map(x=>x.trim())).filter(a=>a[0]&&+a[1]>0).map(a=>({label:a[0],price:+a[1],mrp:+a[2]||+a[1],stock:a[3]===""||a[3]==null?"":+a[3],cost:+a[4]||0}));
const prodIt=it=>cur!="products"?it:{...it,variantsText:(it.variants||[]).map(v=>[v.label,v.price,v.mrp,v.stock,v.cost].join("|")).join("\n"),images:JSON.stringify(it.images||[])};
const allBar=()=>`<div class="fbar"><b style="color:#0f8f7a">Logo for the "All" option</b>${ALLI?`<img src="${esc(ALLI)}" style="width:44px;height:44px;border-radius:50%;object-fit:cover">`:"<small>(not set: default photo is used)</small>"}<input type="file" accept="image/*" style="width:auto" onchange="allUp(this)"><small>Cropped to a square.</small></div>`;
function allUp(el){const f=el.files[0];if(!f)return;cropPick(f,"all",async d=>{if(!d)return;const u=await upData(d);if(u){await api("PUT","settings",{allImg:u});toast("Logo for All saved");tab("categories",true)}})}
const stcA=s=>`<span class="stc s-${String(s).replace(/\W+/g,"")}">${esc(s)}</span>`;
async function pstats(){const L=await api("GET","partnerstats");$("#main").innerHTML=`<div class="top"><h2>Delivery partner stats</h2><button class="btn l" onclick="tab('partnerstats')">Refresh</button></div><div class="tw"><table><tr><th>Partner</th><th>Phone</th><th>Today</th><th>This month</th><th>This year</th><th>All time</th><th>Tips</th></tr>${L.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.phone)}</td><td><b>${p.today}</b></td><td>${p.month}</td><td>${p.year}</td><td>${p.total}</td><td>₹${p.tips}</td></tr>`).join("")||`<tr><td colspan="7">No delivery partners yet.</td></tr>`}</table></div>`}
async function codT(id){const r=rows.find(x=>x.id==id);await api("PUT","users/"+id,{codBlocked:!r.codBlocked});toast(r.codBlocked?"Cash on delivery enabled":"Cash on delivery disabled for this user");tab("users",true)}
async function blockU(id){const r=rows.find(x=>x.id==id),why=prompt("Block and delete the account of "+(r.name||r.phone)+"?\nThis phone number and email can never log in or register again.\nReason:","Repeated fake orders / bulk returns");if(why==null)return;await api("POST","users/"+id+"/block",{reason:why});toast("Account blocked and deleted");tab("users",true)}
function viewPostA(id){const p=rows.find(x=>x.id==id);$("#md").innerHTML=`<h3>${esc(p.name||"Post")} <small style="color:#7d8f8d">${esc(p.phone)}</small></h3>${p.type=="video"?`<video src="${esc(p.src)}" controls style="width:100%;border-radius:12px"></video>`:p.type=="image"?`<img src="${esc(p.src)}" style="width:100%;border-radius:12px">`:`<div style="padding:18px;border-radius:12px;background:#e4f6f2;font-size:18px">${esc(p.text)}</div>`}${p.caption?`<p>${esc(p.caption)}</p>`:""}<p><b>${(p.likes||[]).length}</b> likes</p><h4>Comments (${(p.comments||[]).length})</h4>${(p.comments||[]).map(c=>`<div class="dl"><span>${esc(c.name)}: ${esc(c.text)}</span><button class="btn r" onclick="delCmA('${id}','${c.id}')">Delete</button></div>`).join("")||"<small>No comments.</small>"}<br><div style="display:flex;gap:8px"><button class="btn l" onclick="notifyPost('${id}')">Notify user</button><button class="btn r" onclick="shut();del('${id}')">Delete post</button><button class="btn l" onclick="shut()">Close</button></div>`;$("#ov").classList.add("on")}
async function delCmA(id,cid){await api("DELETE","posts/"+id+"/comments/"+cid);toast("Comment deleted");await tab("posts",true);viewPostA(id)}
function actBtns(r){if(cur=="posts")return `<button class="btn l" onclick="viewPostA('${r.id}')">View</button><button class="btn l" onclick="notifyPost('${r.id}')">Notify user</button>`;
 if(cur=="users")return `<button class="btn l" onclick="codT('${r.id}')">${r.codBlocked?"Enable COD":"Disable COD"}</button><button class="btn r" onclick="blockU('${r.id}')">Block & delete</button>`;
 return actBtns0(r)+(r.type=="Delivery partner"&&r.status=="Employee"?`<button class="btn l" onclick="pwM('${r.id}')">${r.pwHash?"Edit password":"Set password"}</button>`:"")}
let LASTC=+localStorage.getItem("qa_lastc")||Date.now();
async function watchCancel(){try{const O=await api("GET","orders"),n=O.filter(o=>o.status=="Cancelled"&&o.cancelledBy=="customer"&&(o.cancelledAt||0)>LASTC);if(!n.length)return;LASTC=Math.max(...n.map(o=>o.cancelledAt));localStorage.setItem("qa_lastc",LASTC);
 let o=$("#ov2");if(!o){o=document.createElement("div");o.id="ov2";o.className="ov";o.style.zIndex=12;o.innerHTML='<div class="md" id="md2"></div>';document.body.appendChild(o)}
 $("#md2").innerHTML=`<h3 style="color:#c0392b">Order cancelled by customer</h3>${n.map(x=>`<div class="warn"><b>#${esc(x.id)}</b> • ${esc(x.phone)} • ₹${x.total}<br>Reason: ${esc(x.cancelReason)}<br>${x.agentName?`Delivery partner <b>${esc(x.agentName)}</b> has been alerted.`:"No delivery partner was assigned yet."}${x.refundDue?`<br>Refund due: ₹${x.refundDue}`:""}</div>`).join("")}<button class="btn" onclick="cropClose()">OK</button>`;o.classList.add("on")}catch(e){}}

SZ.badges_img=[3,1,600];
async function setSeq(id,v){const k=SKK[cur],x=await api("PUT",cur+"/"+id,{[k]:v===""?"":+v});if(x&&x.error){toast(x.error,4500)}else toast("Sequence saved");tab(cur,true)}
function inpT(v){const O=[["","Do nothing"],["offers","Offers page"],["cart","Cart"],["comm","Community"],["orders","My orders"],["returns","Returns & refunds"],["support","Customer service chat"],["request","Request a product"],["paylater","LazyPay info"],...cats.map(c=>["cat:"+c,"Category: "+c])];return O.map(x=>`<option value="${esc(x[0])}" ${x[0]==v?"selected":""}>${esc(x[1])}</option>`).join("")}
function logoBlock(st){const t=st.logoType||"text";return `<label style="font-weight:700;font-size:13px;display:block;margin:16px 0 4px">Select logo option</label><select id="s_logoType" onchange="logoUI()">${[["text","Text"],["photo","Photo"],["video","Video"]].map(o=>`<option value="${o[0]}" ${t==o[0]?"selected":""}>${o[1]}</option>`).join("")}</select><input type="hidden" id="s_logoSrc" value="${esc(st.logoSrc||"")}"><input type="hidden" id="s_logoT0" value="${esc(st.logoText||"QIOZO")}"><input type="hidden" id="s_logoR0" value="${esc(st.logoRatio||"16:9")}"><input type="hidden" id="s_logoL0" value="${esc(st.logoLoop||"no")}"><div id="logoUI"></div>`}
function logoUI(){const t=$("#s_logoType").value,src=$("#s_logoSrc").value,box=$("#logoUI"),tx=($("#s_logoText")||{}).value??$("#s_logoT0").value,rt=($("#s_logoRatio")||{}).value||$("#s_logoR0").value,lp=($("#s_logoLoop")||{}).value||$("#s_logoL0").value,L=(l)=>`<label style="font-weight:700;font-size:13px;display:block;margin:10px 0 4px">${l}</label>`;
 let h=L(t=="text"?"Logo text":"Text beside the logo (optional)")+`<input id="s_logoText" maxlength="24" value="${esc(tx)}">`;
 if(t!="text"){h+=L("Logo screen size")+`<select id="s_logoRatio" onchange="logoUI()"><option value="16:9" ${rt=="16:9"?"selected":""}>16:9</option><option value="21:9" ${rt=="21:9"?"selected":""}>21:9 (wider)</option></select>`+L("Upload logo "+t)+`<input type="file" accept="${t=="photo"?"image/*":"video/*"}" onchange="upLogo(this,'${t}')"><small id="lgst" style="color:#7d8f8d"></small><div style="margin-top:8px">${src?(t=="photo"?`<img src="${esc(src)}" style="height:60px;aspect-ratio:${rt.replace(":","/")};object-fit:cover;border-radius:10px">`:`<video src="${esc(src)}" style="height:60px;aspect-ratio:${rt.replace(":","/")};object-fit:cover;border-radius:10px" muted controls></video>`):""}</div>`;
  if(t=="video")h+=L("Keep playing the video in a loop forever")+`<select id="s_logoLoop"><option value="no" ${lp!="yes"?"selected":""}>No: play once, hold the last frame, replay every 5 minutes</option><option value="yes" ${lp=="yes"?"selected":""}>Yes: loop without stopping</option></select>`}
 box.innerHTML=h}
async function upLogo(el,t){const f=el.files[0];if(!f)return;const send=async d=>{if(!d)return;$("#lgst").textContent="Uploading…";const x=await api("POST","upload",{data:d});if(x.url){$("#s_logoSrc").value=x.url;logoUI();toast("Logo uploaded. Press Save settings.")}else $("#lgst").textContent=x.error||"Upload failed"};

let CHSEEN=null,alertT=null,CHA=null;
function beepA(){try{const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.type="square";o.connect(g);g.connect(a.destination);o.frequency.value=988;g.gain.value=.25;o.start();setTimeout(()=>{o.stop();a.close()},350)}catch(e){}}
async function watchChats(){try{const L=await api("GET","chats"),cnt={};L.forEach(c=>cnt[c.id]=c.messages.filter(m=>m.from=="user").length+(c.type=="call"?1:0));if(CHSEEN===null){CHSEEN=cnt;return}const nw=L.filter(c=>c.status=="Open"&&cnt[c.id]>(CHSEEN[c.id]||0));CHSEEN=cnt;if(nw.length)bigAlert(nw)}catch(e){}}
function bigAlert(L){let o=$("#alr");if(!o){o=document.createElement("div");o.id="alr";document.body.appendChild(o)}o.className="alr";o.innerHTML=`<div class="alb"><div class="alh">${L.some(c=>c.type=="call")?"CALL REQUEST":"NEW CUSTOMER CHAT"}</div>${L.map(c=>`<p><b>${esc(c.name)}</b> (${esc(c.phone)})<br>${c.type=="call"?"Wants a call on <b>"+esc(c.contact)+"</b> • "+esc(c.topic):esc((c.messages.filter(m=>m.from=="user").pop()||{}).text||c.topic)}</p>`).join("")}<button class="btn" onclick="ackAlert('${L[0].id}')">Open now</button> <button class="btn l" onclick="ackAlert()">Dismiss</button></div>`;clearInterval(alertT);beepA();alertT=setInterval(beepA,2500);document.title="(!) New customer chat"}
function ackAlert(id){clearInterval(alertT);const o=$("#alr");if(o)o.remove();document.title="QIOZO – Management";if(id)tab("chats").then(()=>openChatA(id))}
async function openChatA(id){const L=await api("GET","chats"),t=L.find(x=>x.id==id);if(!t)return;CHA=id;$("#md").innerHTML=`<h3>${esc(t.name)} <small style="color:#7d8f8d">${esc(t.phone)}</small></h3><p style="color:#7d8f8d;font-size:13px">${esc(t.type=="call"?"CALL REQUEST on "+t.contact:"Chat")} • ${esc(t.path||t.topic)}</p><div class="cw" id="cwa">${t.messages.map(m=>`<div class="cm ${m.from}"><span>${esc(m.text)}</span><small>${new Date(m.ts).toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"})}</small></div>`).join("")||"<small>No messages yet.</small>"}</div><div style="display:flex;gap:8px"><input id="rpl" placeholder="Type a reply" onkeydown="if(event.key=='Enter')sendRpl()"><button class="btn" onclick="sendRpl()">Send</button></div><br><div style="display:flex;gap:8px"><button class="btn l" onclick="closeChat('${id}')">${t.status=="Open"?"Close this chat":"Reopen"}</button><button class="btn l" onclick="shut()">Hide</button></div>`;$("#ov").classList.add("on");const w=$("#cwa");w.scrollTop=w.scrollHeight}
async function sendRpl(){const x=$("#rpl").value.trim();if(!x)return;const r=await api("POST","chats/"+CHA+"/reply",{text:x});if(r.error)return toast(r.error);openChatA(CHA)}
async function closeChat(id){const L=await api("GET","chats"),t=L.find(x=>x.id==id);await api("PUT","chats/"+id,{status:t.status=="Open"?"Closed":"Open"});shut();tab("chats",true)}
function actBtns(r){if(cur=="posts")return `<button class="btn l" onclick="viewPostA('${r.id}')">View</button><button class="btn l" onclick="notifyPost('${r.id}')">Notify user</button>`;
 if(cur=="users")return `<button class="btn l" onclick="codT('${r.id}')">${r.codBlocked?"Enable COD":"Disable COD"}</button><button class="btn r" onclick="blockU('${r.id}')">Block & delete</button>`;

 return actBtns0(r)+(r.type=="Delivery partner"&&r.status=="Employee"?`<button class="btn l" onclick="pwM('${r.id}')">${r.pwHash?"Edit password":"Set password"}</button>`:"")}
