 const c=D.coupons.find(x=>x.code==coupon);let cd=0;if(c&&sub>=(+c.min||0)&&(c.first!="yes"||!LS("fm2_oc",0)))cd=Math.round(c.type=="pct"?Math.min(sub*c.value/100,+c.max||1e9):+c.value);cd=Math.min(cd,sub);
 const fee=n?dfee():0,pf=n?(+D.settings.platformFee||0):0,pk=n?(+D.settings.packFee||0):0;return{it,mrp,sub,n,cd,c,fee,pf,pk,tot:sub-cd+(fee||0)+pf+pk}}
