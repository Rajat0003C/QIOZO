<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="color-scheme" content="light"><meta name="viewport" content="width=device-width, initial-scale=1"><title>QIOZO – Delivery Partner</title><style>
:root{--p:#0f8f7a;--bd:#d6ece8;--soft:#e4f6f2}*{box-sizing:border-box;margin:0}body{font-family:"Nunito","Segoe UI",system-ui,sans-serif;background:#f4fbfa;color:#1b2b2a;padding-bottom:30px}
header{background:linear-gradient(#3cc7b3,#0f8f7a);color:#fff;padding:16px;display:flex;justify-content:space-between;align-items:center}
main{max-width:560px;margin:auto;padding:14px}.c{background:#fff;border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:0 1px 6px #0001}h3{margin:14px 0 8px}
button,a.b{font:inherit;border:0;border-radius:10px;padding:10px 14px;font-weight:700;background:var(--p);color:#fff;cursor:pointer;text-decoration:none;display:inline-block;margin:6px 6px 0 0}.l{background:var(--soft)!important;color:var(--p)!important}.r{background:#dc2626!important}
input{font:inherit;width:100%;border:1.5px solid var(--bd);border-radius:10px;padding:11px;margin-bottom:10px}.chip{background:var(--soft);color:var(--p);font-weight:700;font-size:12px;padding:2px 8px;border-radius:8px}small{color:#7d8f8d}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.st div{background:#fff;border-radius:12px;padding:10px;text-align:center;box-shadow:0 1px 6px #0001}.st b{display:block;font-size:24px;color:var(--p)}
.warn{background:#fde8e8;border-left:5px solid #dc2626;border-radius:12px;padding:10px 12px;margin-bottom:10px}.new{border:2px solid #f08a24}
</style></head><body><header><b style="font-size:20px;letter-spacing:2px">QIOZO Delivery</b><button class="l" id="lo" style="display:none;margin:0" onclick="out()">Log out</button></header><main id="app"></main>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let tok=localStorage.getItem("qz_agent_tok"),G=null,gid=null,last=0,known=null;
const api=async(m,u,b)=>{const r=await fetch("/api/agent/"+u,{method:m,headers:{"Content-Type":"application/json","x-agent-token":tok||""},body:b?JSON.stringify(b):undefined});if(r.status==401&&u!="login"){out();throw 0}return r.json()};
function out(){localStorage.removeItem("qz_agent_tok");if(G!=null)navigator.geolocation.clearWatch(G);location.reload()}
function loginV(){$("#app").innerHTML=`<div class="c"><h3 style="margin-top:0">Delivery partner login</h3><input id="ph" inputmode="numeric" maxlength="10" placeholder="Mobile number"><input id="pw" type="password" placeholder="Password given by QIOZO"><button onclick="doLogin()">Log in</button></div>`}
async function doLogin(){const r=await api("POST","login",{phone:$("#ph").value.trim(),password:$("#pw").value});if(!r.token)return alert(r.error||"Login failed");tok=r.token;localStorage.setItem("qz_agent_tok",tok);load()}
function beep(){try{const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=880;g.gain.value=.2;o.start();setTimeout(()=>{o.stop();a.close()},400)}catch(e){}}
function gps(id){if(gid===id||!navigator.geolocation)return;gid=id;if(G!=null)navigator.geolocation.clearWatch(G);G=navigator.geolocation.watchPosition(p=>{if(Date.now()-last<4000)return;last=Date.now();api("POST","orders/"+id+"/location",{lat:p.coords.latitude,lng:p.coords.longitude}).catch(()=>{})},()=>{},{enableHighAccuracy:true,maximumAge:2000})}
const left=t=>{const m=Math.ceil((t-Date.now())/6e4);return m>0?m+" min left":"time is over"};
function card(o,kind){const ad=o.address||{},cash=/^Cash/.test(o.pay||"");
 const head=`<b>#${esc(o.id)}</b> <span class="chip">${esc(o.status)}</span><br><small>${(o.items||[]).map(i=>esc(i.name)+(i.unit?" ("+esc(i.unit)+")":"")+" × "+i.q).join(", ")}</small>${o.gift?`<p style="background:#fff4e5;border-radius:10px;padding:8px;margin-top:6px"><b>GIFT${o.gift.wrap?" (gift packaging)":""}</b> for ${esc(o.gift.name)}<br>${esc(o.gift.address)}<br>Phone: ${esc(o.gift.phone)}</p>`:""}<p style="margin-top:6px">${esc(ad.a||"")} ${esc(ad.d||"")} • ${esc(o.dist||"?")} km${o.scheduledFor?"<br>Scheduled: "+new Date(o.scheduledFor).toLocaleString("en-IN",{weekday:"short",hour:"numeric",minute:"2-digit"}):""}</p>${cash?`<p><b>Collect ₹${esc(o.total)} cash${o.extraDue?" + ₹"+o.extraDue+" address change":""}</b></p>`:`<p><small>Paid online${o.extraDue?" • collect ₹"+o.extraDue+" address change":""}</small></p>`}${o.tip?`<p><small>Tip ₹${esc(o.tip)}</small></p>`:""}`;
 if(kind=="cancelled")return `<div class="warn"><b>Order #${esc(o.id)} was cancelled by the customer.</b><br><small>Reason: ${esc(o.cancelReason||"")}</small><br>Please do not deliver it.<br><button onclick="ack('${o.id}')">OK, understood</button></div>`;
 if(kind=="new")return `<div class="c new">${head}<small>First partner to accept gets this order. You will have ${"{pickup}"} minutes to reach the store.</small><br><button onclick="acc('${o.id}')">Accept this order</button></div>`;
 const tel=esc(o.contact||o.phone),nav=`https://www.google.com/maps/dir/?api=1&destination=${o.dest?o.dest.lat+","+o.dest.lng:encodeURIComponent((ad.a||"")+" "+(ad.d||""))}`;
 return `<div class="c">${head}${o.status=="Partner assigned"?`<p style="color:#c2410c"><b>Reach the store: ${o.reachBy?left(o.reachBy):""}</b></p><button onclick="pick('${o.id}')">Picked up, start delivery</button>`:`<a class="b l" href="tel:${tel}">Call customer</a><a class="b l" target="_blank" href="${nav}">Navigate</a><button class="l" onclick="setEta('${o.id}')">Set time left</button><button onclick="done('${o.id}')">Delivered</button>`}</div>`}
async function load(){if(!tok)return loginV();$("#lo").style.display="";try{const [L,S]=await Promise.all([api("GET","orders"),api("GET","stats")]),mine=L.filter(o=>o.agentId&&o.status!="Cancelled"),canc=L.filter(o=>o.status=="Cancelled"),av=L.filter(o=>!o.agentId);
 const ids=av.map(o=>o.id);if(known===null)known=ids;else{const nw=ids.filter(i=>!known.includes(i));if(nw.length){beep();if("Notification" in window&&Notification.permission=="granted")new Notification("New order available",{body:"Order "+nw[0]+" is waiting for a delivery partner"})}known=ids}
 $("#app").innerHTML=`<div class="st"><div><b>${S.today}</b><small>Today</small></div><div><b>${S.month}</b><small>This month</small></div><div><b>${S.year}</b><small>This year</small></div></div>${canc.map(o=>card(o,"cancelled")).join("")}<h3>My deliveries (${mine.length})</h3>${mine.map(o=>card(o,"mine")).join("")||"<small>No active delivery.</small>"}<h3>New orders (${av.length})</h3>${av.map(o=>card(o,"new").replace("{pickup}","a few")).join("")||"<small>No orders waiting right now.</small>"}<p><small>Keep this page open. New orders ring a bell. While delivering, your live location is shared with the customer. GPS needs HTTPS (or localhost).</small></p>`;
 const act=mine.find(o=>o.status=="Out for delivery");if(act)gps(act.id);else if(G!=null){navigator.geolocation.clearWatch(G);G=null;gid=null}}catch(e){}}
async function acc(id){const r=await api("POST","orders/"+id+"/accept",{});if(r.error)alert(r.error);load()}
async function pick(id){const r=await api("POST","orders/"+id+"/pickup",{});if(r.error)alert(r.error);load()}
async function ack(id){await api("POST","orders/"+id+"/ack",{});load()}
async function done(id){if(!confirm("Mark this order as delivered?"))return;await api("POST","orders/"+id+"/delivered",{});load()}
async function setEta(id){const m=+prompt("Minutes left to reach the customer?");if(m>0){await api("POST","orders/"+id+"/eta",{min:m});load()}}
async function where(id){const t=prompt("Where is the order now? (shown to the customer)","Near the market, 5 minutes away");if(t){await api("POST","orders/"+id+"/where",{text:t});load()}}
if("Notification" in window&&Notification.permission=="default")Notification.requestPermission();
load();setInterval(load,8000);
</script></body></html>
